name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          job_tmp="$RUNNER_TEMP/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build
        env:
          DEPLOY_BASE: /sql-quest/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/dist
  # Runs alongside build so the Playwright suite can't rot unnoticed. Deliberately
  # not a dependency of deploy: a flaky browser run shouldn't block shipping.
  e2e:
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          job_tmp="$RUNNER_TEMP/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: flock "$HOME/.cache/thinkpad-actions-browser.lock" npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/playwright-report/
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, thinkpad]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
